# ============================================================================
# [Optional] GitHub Actions example — use it only if you connect GitHub later.
# You can deploy without this file by using ./kit.sh. Copy it to .github/workflows/deploy.yml
# - It uses Workload Identity Federation (WIF). Never use a JSON key file.
# - The TA/portal must enable WIF for your repo first. Then set these repository variables:
#     GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT
#   (values are in the Team resources tab > GitHub variables), and PREFIX, MIGRATE_COMMAND (if you have one)
# ============================================================================
name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write   # required for WIF
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo   # the environment name must match the WIF condition set by the portal
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      PREFIX: ${{ vars.PREFIX }}
      MIGRATE_COMMAND: ${{ vars.MIGRATE_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Docker login to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Create resources.env for kit.sh (no secrets)
        run: |
          {
            echo "PROJECT_ID=${PROJECT_ID}"; echo "REGION=${REGION}"; echo "PREFIX=${PREFIX}"
            echo "PORT=8080"
            echo "MIGRATE_COMMAND=${MIGRATE_COMMAND}"
          } > resources.env
      - name: Build, migrate, deploy
        run: bash ./project-kit/kit.sh --yes --env-file resources.env build && bash ./project-kit/kit.sh --yes --env-file resources.env deploy
